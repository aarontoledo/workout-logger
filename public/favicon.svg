<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Amber tile (app accent #f59e0b) with a dark dumbbell (#020617): readable on light and dark tabs -->
  <rect width="64" height="64" rx="14" fill="#f59e0b"/>
  <g fill="#020617">
    <!-- bar -->
    <rect x="8" y="29" width="48" height="6" rx="2"/>
    <!-- inner plates -->
    <rect x="16" y="16" width="8" height="32" rx="2.5"/>
    <rect x="40" y="16" width="8" height="32" rx="2.5"/>
    <!-- outer plates -->
    <rect x="9" y="22" width="6" height="20" rx="2"/>
    <rect x="49" y="22" width="6" height="20" rx="2"/>
  </g>
</svg>
